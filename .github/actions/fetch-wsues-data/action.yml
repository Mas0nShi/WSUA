name: 'Fetch WSUEs Data'
description: 'Fetch WSUEs data for specified date and products'
inputs:
  wsues-path:
    description: 'Path to WSUEs executable'
    required: true
  storage-path:
    description: 'Path to storage directory'
    required: true
  date:
    description: 'Date to fetch data for (YYYY-MM format)'
    required: true
  product:
    description: 'Product name to fetch'
    required: true
  output-name:
    description: 'Custom output filename (relative to storage path)'
    required: false
outputs:
  output-files:
    description: 'Path pattern to output files'
    value: ${{ steps.fetch.outputs.output-files }}

runs:
  using: 'composite'
  steps:
    - name: Fetch WSUEs data
      id: fetch
      shell: powershell
      run: |
        $wsuesExe = "${{ inputs.wsues-path }}\wsues.exe"
        $storagePath = "${{ inputs.storage-path }}"
        $date = "${{ inputs.date }}"
        $product = "${{ inputs.product }}"
        $outputNameInput = "${{ inputs.output-name }}"
        
        Write-Host "Fetching WSUEs data..."
        Write-Host "  Date: $date"
        Write-Host "  Product: $product"
        
        try {
          if (-not $product) {
            Write-Error "Product name is required"
            exit 1
          }

          function Get-SafeName {
            param([string]$value)
            $safe = $value -replace '[\\/:*?"<>|]', '_'
            $safe = $safe -replace '\s+', '_'
            return $safe
          }

          if ([string]::IsNullOrWhiteSpace($outputNameInput)) {
            $safeProduct = Get-SafeName -value $product
            $outputName = "{0}_{1}.json" -f $safeProduct, $date
          } else {
            $outputName = $outputNameInput
          }

          $outputFile = Join-Path $storagePath $outputName
          $outputDir = Split-Path -Parent $outputFile
          if ($outputDir) {
            New-Item -ItemType Directory -Path $outputDir -Force | Out-Null
          }

          Write-Host "  Output: $outputFile"
          
          & $wsuesExe get --date $date --product $product -o $outputFile
          
          if ($LASTEXITCODE -ne 0) {
            Write-Error "WSUEs fetch failed with exit code $LASTEXITCODE"
            exit 1
          }
          
          echo "output-files=$outputFile" >> $env:GITHUB_OUTPUT
          Write-Host "Product fetch completed"

        } catch {
          Write-Error "Fetch operation failed: $($_.Exception.Message)"
          exit 1
        }